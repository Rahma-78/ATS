<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <script src="{{ url_for('static',path='script.js') }}?v=1"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>ATS Resume Analyzer</h1>
            <p>Upload a resume and job description to get a detailed analysis.</p>
        </header>
        <main>
            <form id="analysis-form" action="/api/v1/analyze" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="job-description">Job Description</label>
                    <textarea id="job-description" name="job_description" rows="10"
                        placeholder="Paste the job description here..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="resume">Resume</label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx,.txt" required>
                </div>
                <button type="submit" id="submit-btn">Analyze</button>
            </form>
            <div id="loading-spinner" class="spinner-container hidden">
                <div class="spinner"></div>
            </div>
            <div id="error-container" class="hidden">
                <h3>Error</h3>
                <p id="error-message"></p>
            </div>
            <div id="results-container" class="hidden">
                <h2>Analysis Results</h2>
                <div id="results"></div>
            </div>
        </main>

    </div>
</body>

</html>
